# Serves the built app and forwards /api/* to the API (as /*)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # (repeated in each location below: an add_header in a location drops
  # the server's own, rather than adding to them)
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # replies stream word by word: pass them on as they come
    proxy_buffering off;
    proxy_cache off;
    # slow models and long answers
    proxy_read_timeout 300s;
    # a 20 MB attachment is about 27 MB once base64-encoded in JSON
    client_max_body_size 40m;
  }

  # built files have content hashes in their names, so they never change
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    try_files $uri =404;
  }

  # everything else is the app, which routes on the client (/chat/..., /admin/...)
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    try_files $uri /index.html;
  }
}
